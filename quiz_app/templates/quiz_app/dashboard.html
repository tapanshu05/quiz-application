<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FormulaFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d14;
            --bg-card: #111723;
            --bg-card-hover: #151d2b;
            --border-subtle: #1e293b;
            --accent-teal: #00d2b5;
            --accent-teal-glow: rgba(0, 210, 181, 0.16);
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 15% 0%, rgba(0, 210, 181, 0.06) 0%, transparent 45%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar-teachoo {
            background-color: rgba(9, 13, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-logo {
            font-size: 23px;
            font-weight: 800;
            color: var(--accent-teal);
            letter-spacing: -0.5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .user-badge {
            background: #161f30;
            border: 1px solid #2b384e;
            color: #e2e8f0;
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .user-badge:hover {
            border-color: var(--accent-teal);
            color: #ffffff;
        }

        /* Hero Welcome Banner */
        .dashboard-header {
            background: linear-gradient(135deg, #111826 0%, #152132 100%);
            border: 1px solid #223046;
            border-radius: 20px;
            padding: 34px;
            margin-top: 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        .dashboard-header::after {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(0, 210, 181, 0.14) 0%, transparent 70%);
            pointer-events: none;
        }
        .class-tag {
            background: rgba(0, 210, 181, 0.12);
            border: 1px solid rgba(0, 210, 181, 0.3);
            color: var(--accent-teal);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 5px 14px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .btn-pro {
            background: linear-gradient(135deg, #00d2b5 0%, #00a896 100%);
            color: #061018;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 210, 181, 0.25);
        }
        .btn-pro:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 210, 181, 0.38);
            color: #061018;
        }
        .btn-history {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-history:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #64748b;
            color: #ffffff;
        }

        /* Quick Stat Strip */
        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(0, 210, 181, 0.1);
            color: var(--accent-teal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }

        /* Section Toolbar & Search */
        .section-bar {
            margin-top: 34px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 12px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
            margin: 0;
        }
        .search-box {
            background: #111723;
            border: 1px solid #263348;
            color: #ffffff;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13.5px;
            width: 240px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box::placeholder {
            color: #64748b;
        }
        .search-box:focus {
            border-color: var(--accent-teal);
        }

        /* Subject Cards */
        .subject-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 26px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        .subject-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-teal);
            transform: translateY(-6px);
            box-shadow: 0 18px 35px -12px rgba(0, 210, 181, 0.18);
        }
        .subject-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #192336, #121927);
            border: 1px solid #28354d;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 1
