<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FormulaFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin: 0;
        }

        /* Subtle Glow Background Effect */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 210, 181, 0.15) 0%, rgba(11, 15, 23, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .auth-card {
            position: relative;
            z-index: 1;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 210, 181, 0.05);
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            color: #00d2b5;
            letter-spacing: -0.5px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-title {
            font-weight: 700;
            text-align: center;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            background-color: #0b0f17;
            border: 1px solid #1e293b;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #0b0f17;
            border-color: #00d2b5;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 210, 181, 0.15);
        }

        .btn-auth {
            background: linear-gradient(135deg, #00d2b5 0%, #00b89f 100%);
            color: #0b0f17;
            font-weight: 800;
            border-radius: 12px;
            padding: 13px;
            width: 100%;
            border: none;
            margin-top: 20px;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 181, 0.3);
            color: #0b0f17;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 13px;
        }

        .auth-footer a {
            color: #00d2b5;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: #00d2b5;
        }
    </style>
</head>
<body>

    <!-- Top Left Home Link -->
    <a href="/" class="back-home">← Home Page</a>

    <!-- Background Glow Effect -->
    <div class="bg-glow"></div>

    <div class="auth-card">
        <a href="/" class="brand-logo">🚀 FormulaFly</a>
        <div class="auth-title">Welcome Back</div>
        <div class="auth-subtitle">Log in to continue your learning journey</div>

        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-auth">Log In ➔</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register for free</a>
        </div>
    </div>

</body>
</html>
