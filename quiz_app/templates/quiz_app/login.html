<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FormulaFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Top Back Button */
        .btn-top-back {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .btn-top-back:hover {
            color: #00d2b5;
        }

        /* Larger Login Card */
        .login-card {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 500px; /* Card ki width bada di */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 210, 181, 0.05);
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 800;
            color: #00d2b5;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-subtitle {
            color: #94a3b8;
            font-size: 15px;
            text-align: center;
            margin-bottom: 35px;
        }

        /* Larger Inputs */
        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-control {
            background-color: #1a2234 !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
            border-radius: 10px !important;
            padding: 14px 16px !important;
            font-size: 16px !important;
            margin-bottom: 20px;
        }

        .form-control:focus {
            border-color: #00d2b5 !important;
            box-shadow: 0 0 0 3px rgba(0, 210, 181, 0.2) !important;
        }

        /* Large Action Button */
        .btn-login {
            background-color: #00d2b5;
            color: #0b0f17;
            font-weight: 800;
            font-size: 17px;
            padding: 14px;
            border-radius: 10px;
            border: none;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: #00b89f;
            color: #0b0f17;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 210, 181, 0.25);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
        }

        .register-link a {
            color: #00d2b5;
            text-decoration: none;
            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <a href="/" class="btn-top-back">← Home Page</a>

    <div class="login-card">
        <a href="/" class="brand-logo">🚀 FormulaFly</a>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Log in to continue your learning journey</p>

        <form method="POST" action="">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required autofocus>
    </div>

    <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="id_password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn-login">Log In ➔</button>
</form>

        <div class="register-link">
            Don't have an account? <a href="{% url 'register' %}">Register for free</a>
        </div>
    </div>

</body>
</html>
