<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FormulaFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .auth-card {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-label {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-control {
            background-color: #0b0f17;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
        }
        .form-control:focus {
            background-color: #0b0f17;
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: none;
        }
        .btn-auth {
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            border: none;
            margin-top: 15px;
            transition: all 0.2s ease;
        }
        .btn-auth:hover {
            background-color: #e2e8f0;
            color: #000000;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
        }
        .auth-footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="/" class="brand-logo">FormulaFly.</a>
        <h4 class="fw-bold text-center mb-1">Welcome Back</h4>
        <p class="text-secondary text-center small mb-4">Log in to continue to your dashboard</p>

        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-auth">Log In ➔</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </div>
    </div>

</body>
</html>
