<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FormulaFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            margin: 0;
        }

        .auth-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            color: #00d2b5;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 8px;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background-color: #0b0f17;
            border: 1px solid #1e293b;
            color: #ffffff;
            border-radius: 12px;
            padding: 11px 15px;
            font-size: 14px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0b0f17;
            border-color: #00d2b5;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 210, 181, 0.15);
        }

        .btn-auth {
            background: linear-gradient(135deg, #00d2b5 0%, #00b89f 100%);
            color: #0b0f17;
            font-weight: 800;
            border-radius: 12px;
            padding: 13px;
            width: 100%;
            border: none;
            margin-top: 20px;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
        }

        .auth-footer a {
            color: #00d2b5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="/" class="brand-logo">🚀 FormulaFly</a>
        <h4 class="fw-bold text-center mb-1">Create Account</h4>
        <p class="text-secondary text-center small mb-4">Start learning step by step for free</p>

        {% if error %}
        <div class="alert alert-danger py-2 small rounded-3 mb-3" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-auth">Register Now ➔</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>

</body>
</html>
