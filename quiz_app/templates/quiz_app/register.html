<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register with OTP - FormulaFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }
        .auth-card {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-label {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            background-color: #0b0f17;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0b0f17;
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: none;
        }
        .btn-otp {
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            font-weight: 600;
            border-radius: 10px;
            font-size: 13px;
            padding: 0 16px;
            white-space: nowrap;
        }
        .btn-otp:hover {
            background-color: #334155;
            color: #ffffff;
        }
        .btn-auth {
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            border: none;
            margin-top: 15px;
            transition: all 0.2s ease;
        }
        .btn-auth:hover {
            background-color: #e2e8f0;
            color: #000000;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
        }
        .auth-footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="/" class="brand-logo">FormulaFly.</a>
        <h4 class="fw-bold text-center mb-1">Create Account</h4>
        <p class="text-secondary text-center small mb-4">Register with Mobile & OTP Verification</p>

        {% if error %}
        <div class="alert alert-danger py-2 small rounded-3" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}

            <!-- Mobile Field + Send OTP Button -->
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <div class="d-flex gap-2">
                    <input type="tel" id="phone_num" class="form-control" placeholder="Enter 10-digit mobile number" required>
                    <button type="button" class="btn btn-otp" onclick="sendOTP()">Send OTP</button>
                </div>
            </div>

            <!-- OTP Input Box -->
            <div class="mb-3" id="otp_container">
                <label class="form-label">Enter OTP</label>
                <input type="text" name="otp_input" class="form-control" placeholder="Enter 4-digit OTP" required>
            </div>

            <button type="submit" class="btn-auth">Register Now ➔</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>

    <script>
        function sendOTP() {
            let phone = document.getElementById('phone_num').value;
            if(phone.length !== 10) {
                alert('कृपया 10 अंकों का सही मोबाइल नंबर डालें!');
                return;
            }

           fetch("/send-otp/", {
                method: "POST",
                headers: { "Content-Type": "json" },
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
            })
            .catch(err => alert("Error sending OTP!"));
        }
    </script>
</body>
</html>
